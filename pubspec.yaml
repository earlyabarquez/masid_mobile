name: masid
description: "M.A.S.I.D — Municipal Assessment of Spatial Incident Density"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.0

  # Map (Leaflet-based, FREE)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Camera & Image
  image_picker: ^1.1.2

  # Image Upload (Cloudinary)
  cloudinary_public: ^0.23.1

  # Auth & Storage
  shared_preferences: ^2.3.4

  # Firebase (Notifications)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # Offline Support
  connectivity_plus: ^6.1.4
  sqflite: ^2.4.2
  path: ^1.9.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  lottie: ^3.3.1

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.7
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora/Sora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sora/Sora-ExtraBold.ttf
          weight: 800
